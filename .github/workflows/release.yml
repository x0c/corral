name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本标签（如 v0.24.2）"
        required: true

permissions:
  contents: write

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_17" }
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_17" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: universal2, manylinux: auto }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist/*.whl

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install 'maturin>=1.9,<2'
      - run: maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*.tar.gz

  github-release:
    needs: [wheels, source]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        run: echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - run: sha256sum dist/* > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: dist/*

  bump-homebrew-formula:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate Homebrew formula (wheel-first)
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.github-release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          git clone "https://x-access-token:${COMMITTER_TOKEN}@github.com/x0c/homebrew-tap.git" tap
          # 生成器优先用预编译 wheel（免 Rust 工具链），缺 wheel 的平台回退源码编译；
          # 自带防回退（tap 里配方已是更新版本就跳过，退出码 3）--排队积压时旧
          # tag 的 bump 任务晚执行也不能把版本写回去。
          rc=0
          GITHUB_API_TOKEN="${COMMITTER_TOKEN}" \
            python3 scripts/homebrew_formula.py --tag "${VERSION}" --tap-dir tap || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "配方已是更新的版本，跳过回写 ${version}"
            exit 0
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          if git -C tap diff --quiet -- Formula/corral.rb; then exit 0; fi
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C tap add Formula/corral.rb
          git -C tap commit -m "corral ${version}"
          git -C tap push origin main
