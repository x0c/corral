name: test

on:
  # 只跑分支推送。tag 推送会与发布同一个提交在 main 上的推送产生完全重复的一轮
  # 矩阵（每次发版凭空多出 7 个作业），在免费并发额度下直接翻倍排队时间。
  push:
    branches: ["**"]
  pull_request:

# 同一分支上后推的提交作废前一轮：连续发版时旧提交的矩阵还在排队就已经没有意义，
# 继续占着 runner 只会让新提交等更久。
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ${{ matrix.os }}
    # 单测正常十分钟量级。没有这行时，挂死的作业会一直占着 runner 到平台 6 小时
    # 上限——macOS 免费并发少，两个僵尸作业就能把后面的排队拖到十几小时。
    timeout-minutes: 40
    strategy:
      # 一路挂了就取消其余矩阵，少收重复失败邮件、少占免费并发。
      # 排查「只在某一 Python / OS 挂」时可临时改 false 看全矩阵，修完改回。
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.14" }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Install project and runtime dependencies
        # 带上 remote 附加组件：手机端接力的加密与传输层有单测，缺了会整组跳过，
        # 那等于这条链路在 CI 上没人看着。
        run: python -m pip install ".[remote]"
      - name: Compile
        run: python -m compileall -q src/corral tests
      - name: Lint
        # 固定版本号，避免 ruff 自行升级后规则集变化在 CI 上悄悄多出新的拦截项。
        run: |
          python -m pip install ruff==0.16.1
          ruff check src tests
      - name: Test
        # 走 scripts/ci-test.py 而不是裸 unittest：挂死时自动打印全部线程栈，
        # 已知 Pilot 偶发自动重跑一次再判定。说明见该脚本头部注释。
        run: python scripts/ci-test.py
      - name: Verify native accelerator
        run: python -c "from corral.native import available; assert available()"
